<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - E-Perjanjian</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen p-4 sm:p-8">

    <div class="max-w-5xl mx-auto bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200">
        <!-- Header Admin -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
            <div>
                <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Dashboard Admin</h2>
                <p class="text-sm text-slate-500 mt-1">Daftar Riwayat Surat Perjanjian Hutang</p>
            </div>
            <button onclick="loadData()" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-indigo-50 text-indigo-700 px-5 py-2.5 rounded-lg text-sm font-semibold hover:bg-indigo-100 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                Refresh Data
            </button>
        </div>
        
        <!-- Tabel Data -->
        <div class="overflow-x-auto rounded-xl border border-slate-200">
            <table class="w-full text-left border-collapse whitespace-nowrap">
                <thead>
                    <tr class="bg-slate-50 text-slate-700 border-b border-slate-200">
                        <th class="p-4 font-semibold text-sm">Tanggal Dibuat</th>
                        <th class="p-4 font-semibold text-sm">Nama Peminjam</th>
                        <th class="p-4 font-semibold text-sm">NIK</th>
                        <th class="p-4 font-semibold text-sm text-center">Aksi Dokumen</th>
                    </tr>
                </thead>
                <tbody id="tabel-data">
                    <tr>
                        <td colspan="4" class="p-12 text-center text-slate-500">
                            <svg class="animate-spin h-8 w-8 text-indigo-500 mx-auto mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                            Menghubungkan ke Supabase...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Supabase Script -->
    <script type="module">
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
        const SUPABASE_URL = 'https://gubnixlyotwyrqwctvxp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_FOjmU05pn5_gmDY6lrhbKQ_B9kbfaiL';
        
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const tabel = document.getElementById('tabel-data');

        // Fungsi utama untuk mengambil data
        window.loadData = async function() {
            tabel.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-slate-500">Memuat pembaruan data...</td></tr>`;
            
            try {
                // Ambil data dari tabel surat_perjanjian, urutkan dari yang paling baru
                const { data, error } = await supabase
                    .from('surat_perjanjian')
                    .select('*')
                    .order('tanggal_dibuat', { ascending: false });

                if (error) throw error;

                tabel.innerHTML = ""; 
                
                if (data && data.length > 0) {
                    data.forEach((row) => {
                        const waktuLokal = new Date(row.tanggal_dibuat + 'Z');
                        const tanggalFmt = new Date(row.tanggal_dibuat).toLocaleDateString('id-ID', { 
                            day: 'numeric', month: 'long', year: 'numeric', 
                            hour: '2-digit', minute:'2-digit' 
                        }); + ' WIB';

                        const tr = `
                            <tr class="hover:bg-slate-50/80 border-b border-slate-100 transition-colors">
                                <td class="p-4 text-sm text-slate-500">${tanggalFmt}</td>
                                <td class="p-4 text-sm font-semibold text-slate-800">${row.nama}</td>
                                <td class="p-4 text-sm font-mono text-slate-600">${row.nik}</td>
                                <td class="p-4 text-center">
                                    <a href="${row.file_url}" target="_blank" class="inline-flex items-center gap-2 bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-800 transition-transform hover:-translate-y-0.5 shadow-sm">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                        Unduh PDF
                                    </a>
                                </td>
                            </tr>
                        `;
                        tabel.innerHTML += tr;
                    });
                } else {
                    tabel.innerHTML = `<tr><td colspan="4" class="p-12 text-center text-slate-500 bg-slate-50/50">Belum ada data perjanjian hutang yang masuk.</td></tr>`;
                }
            } catch (err) {
                console.error("Error fetching data:", err);
                tabel.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-rose-500 font-medium">Gagal memuat data. Pastikan konfigurasi Supabase sudah benar.</td></tr>`;
            }
        };

        // Otomatis jalankan muat data saat halaman pertama kali dibuka
        loadData();
    </script>
</body>
</html>
